apiVersion: apps/v1
kind: Deployment
metadata:
  name: minikube-dotnet
  namespace: default
  labels:
    app: minikube-dotnet
spec:
  replicas: 2
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  selector:
    matchLabels:
      app: minikube-dotnet
  template:
    metadata:
      labels:
        app: minikube-dotnet
    spec:
      containers:
        - name: hello-dotnet
          image: vtamorims/hello-dotnet:v1.1
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              protocol: TCP
          env:
            - name: Featuremanagement__BooleanFilter
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: Featuremanagement__BooleanFilter
            - name: DB__PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: DB__PASSWORD
          resources: {}
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: minikube-dotnet
  namespace: default
  labels:
    app: minikube-dotnet
spec:
  type: NodePort
  selector:
    app: minikube-dotnet
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30605
      protocol: TCP
  externalTrafficPolicy: Cluster
  internalTrafficPolicy: Cluster
  ipFamilyPolicy: SingleStack
  sessionAffinity: None
