name: Demo CI env and secrets

on: push

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Say Hello
        run: echo "Hello from the second workflow!"

      - name: Display Env Value
        env:
          APP_ENV: test
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: echo "Environment $APP_ENV using $DB_PASSWORD"
