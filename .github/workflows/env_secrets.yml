name: Demo CI env and secrets

on: 
  # push
  workflow_dispatch:

env:
  GLOBAL_APP_ENV: global-dev

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      JOB_APP_ENV: job-dev

    steps:
      - name: Say Hello
        run: echo "Hello from the second workflow!"

      - name: Display Env Value
        env:
          APP_ENV: test
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: echo "Environment $APP_ENV using $DB_PASSWORD"

      - name: Display Env Global
        run: echo "Environment global $GLOBAL_APP_ENV"

      - name: Display Env Job
        run: echo "Environment job $JOB_APP_ENV"
